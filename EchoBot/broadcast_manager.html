<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广播机器人管理面板</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0f1220;
  color: #e8ecf5;
  font-family: 'Segoe UI', sans-serif;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  max-width: 700px;
  width: 100%;
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 28px 24px;
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
h1 {
  font-size: 24px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
h1 small {
  font-size: 14px;
  font-weight: 400;
  color: #9aa3b5;
}
.status-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: #2a2e42;
  color: #9aa3b5;
}
.status-badge.online { background: #1a4d2e; color: #4ade80; }
.status-badge.paused { background: #4d3a1a; color: #fbbf24; }
.status-badge.offline { background: #4d1a1a; color: #f87171; }

.section {
  margin: 20px 0 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 16px;
}
.section-title {
  font-size: 14px;
  color: #9aa3b5;
  margin-bottom: 10px;
  letter-spacing: 1px;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.btn {
  padding: 8px 18px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 600;
  transition: all .2s;
  background: rgba(255,255,255,0.08);
  color: #e8ecf5;
}
.btn:hover { background: rgba(255,255,255,0.16); transform: translateY(-1px); }
.btn-primary { background: #4f8cff; color: #fff; }
.btn-primary:hover { background: #3a7aff; }
.btn-success { background: #28c840; color: #fff; }
.btn-success:hover { background: #1fb83a; }
.btn-warning { background: #fbbf24; color: #1a1e2e; }
.btn-warning:hover { background: #f5b00e; }
.btn-danger { background: #ff5f57; color: #fff; }
.btn-danger:hover { background: #f54a42; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.15); }
input, select {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 8px 14px;
  color: #e8ecf5;
  font-size: 14px;
  outline: none;
  flex: 1;
  min-width: 120px;
}
input:focus { border-color: #4f8cff; }
.msg-input { display: flex; gap: 8px; }
.msg-input input { flex: 1; }
.user-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.user-tag {
  background: rgba(79,140,255,0.15);
  border: 1px solid rgba(79,140,255,0.2);
  border-radius: 16px;
  padding: 4px 14px;
  font-size: 12px;
  color: #93bbfc;
}
.log-area {
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 10px 14px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 12px;
  font-family: 'Consolas', monospace;
  color: #9aa3b5;
  line-height: 1.7;
  margin-top: 8px;
}
.log-area .log-time { color: #6b7a8f; }
.log-area .log-ok { color: #4ade80; }
.log-area .log-warn { color: #fbbf24; }
.log-area .log-err { color: #f87171; }
</style>
</head>
<body>
<div class="container" id="app">
  <h1>📡 广播机器人 <small>管理面板</small></h1>
  <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <span id="statusBadge" class="status-badge">离线</span>
    <span id="roomDisplay" style="color:#9aa3b5; font-size:13px;">房间: lobby</span>
    <span id="userCount" style="color:#9aa3b5; font-size:13px;">在线: 0</span>
  </div>

  <div class="section">
    <div class="section-title">🎮 控制</div>
    <div class="row">
      <button class="btn btn-success" onclick="sendCmd('resume')">▶ 启动广播</button>
      <button class="btn btn-warning" onclick="sendCmd('pause')">⏸ 暂停广播</button>
      <button class="btn btn-danger" onclick="sendCmd('stop')">⏹ 停止机器人</button>
      <button class="btn btn-outline" onclick="sendCmd('status')">🔄 刷新状态</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">⏱️ 广播间隔（秒）</div>
    <div class="row">
      <input type="number" id="intervalInput" value="2" min="1" max="60" style="width:100px;" />
      <button class="btn btn-primary" onclick="setInterval()">设置</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">💬 发送消息</div>
    <div class="msg-input">
      <input type="text" id="msgInput" placeholder="输入要广播的消息…" />
      <button class="btn btn-primary" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">👥 在线用户</div>
    <div id="userList" class="user-list"><span style="color:#6b7a8f;">等待数据…</span></div>
  </div>

  <div class="section">
    <div class="section-title">📋 日志</div>
    <div id="logArea" class="log-area"></div>
  </div>
</div>

<script>
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const ADMIN_TOPIC = "navchat/admin";
const STATUS_TOPIC = "navchat/status";

let client = null;
let connected = false;

const statusBadge = document.getElementById('statusBadge');
const roomDisplay = document.getElementById('roomDisplay');
const userCount = document.getElementById('userCount');
const userList = document.getElementById('userList');
const logArea = document.getElementById('logArea');

function addLog(msg, type = '') {
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
  logArea.appendChild(entry);
  logArea.scrollTop = logArea.scrollHeight;
}

function connectMqtt() {
  client = mqtt.connect(BROKER);
  client.on('connect', () => {
    connected = true;
    addLog('✅ 已连接到 MQTT 服务器', 'ok');
    client.subscribe(STATUS_TOPIC);
    client.subscribe(ADMIN_TOPIC);
    sendCmd('status');
  });
  client.on('message', (topic, payload) => {
    try {
      const msg = JSON.parse(payload.toString());
      if (topic === STATUS_TOPIC) updateStatus(msg);
      else if (topic === ADMIN_TOPIC) addLog(`📨 收到指令: ${msg.action}`, 'warn');
    } catch (e) {}
  });
  client.on('close', () => { connected = false; addLog('❌ MQTT 断开', 'err'); });
  client.on('error', (e) => { addLog(`⚠️ MQTT 错误: ${e.message}`, 'err'); });
}

function sendCmd(action, extra = {}) {
  if (!client || !connected) {
    addLog('⚠️ 未连接到 MQTT，请检查网络', 'err');
    return;
  }
  const cmd = { action, ...extra };
  client.publish(ADMIN_TOPIC, JSON.stringify(cmd));
  addLog(`📤 发送指令: ${action}`, 'ok');
}

function setInterval() {
  const val = document.getElementById('intervalInput').value;
  if (!val || val < 1) return;
  sendCmd('set_interval', { value: parseFloat(val) });
}

function sendMessage() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text) return;
  sendCmd('send', { text });
  inp.value = '';
}

function updateStatus(data) {
  const status = data.status || 'offline';
  const users = data.online || [];
  const interval = data.interval || 2;
  const room = data.room || 'lobby';

  statusBadge.textContent = status === 'running' ? '🟢 运行中' :
                            status === 'paused' ? '🟡 已暂停' : '🔴 离线';
  statusBadge.className = 'status-badge ' + status;

  roomDisplay.textContent = `房间: ${room}`;
  userCount.textContent = `在线: ${users.length}`;
  document.getElementById('intervalInput').value = interval;

  if (users.length) {
    userList.innerHTML = users.map(u => `<span class="user-tag">${u}</span>`).join('');
  } else {
    userList.innerHTML = '<span style="color:#6b7a8f;">暂无在线用户</span>';
  }
  addLog(`📊 状态更新: ${status}, 在线 ${users.length} 人`, 'warn');
}

connectMqtt();
document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
